<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FID · Cambio de espacio de trabajo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* ---------- Tokens (valores de Figma) ---------- */
:root{
  --bg-default:#fff;
  --bg-surface:#f8f9fa;
  --bg-subtle:#f1f3f5;
  --bg-subtle-light:#f8f9fa;
  --bg-inputs:#f8f9fa;
  --stroke:#dee2e6;
  --text-default:#0b0c0e;
  --text-subtle:#495057;
  --text-subtle-light:#6c757d;
  --text-placeholder:#adb5bd;
  --gray-900:#333;
  --gray-800:#454545;
  --gray-700:#4f4f4f;
  --gray-200:#d1d1d1;
  --gray-100:#e7e7e7;
  --neutral80:#cacaca;
  --blue-50:#edf4ff;
  --blue-100:#deecff;
  --blue-200:#c3daff;
  --blue-300:#9fc0ff;
  --blue-600:#3a4ef1;
  --blue-700:#2a3ad0;
  --brand-20:#f5f6fe;
  --brand-30:#f2f3fe;
  --brand-50:#edeffd;
  --brand-100:#c7ccfa;
  --brand-500:#2a39d0;
  --purple-100:#ebeafd;
  --purple-200:#d9d8fc;
  --purple-400:#9c90f5;
  --purple-700:#5930d1;
  --error-alert:#d74141;
  --error-bg:#fdeaea; --error-text:#b62424;
  --success-bg:#e6f9ed; --success-text:#1e824c;
  --warning-bg:#fff9e6; --warning-text:#a37200;
  --shadow-8dp:0 119px 33px 0 rgba(72,70,82,0),0 76px 31px 0 rgba(72,70,82,.01),0 43px 26px 0 rgba(72,70,82,.04),0 19px 19px 0 rgba(72,70,82,.07),0 5px 10px 0 rgba(72,70,82,.08),0 0 0 0 rgba(72,70,82,.08);
  --shadow-elev1:0 4px 25px rgba(33,33,33,.08),0 4px 3px rgba(33,33,33,.04);
  --shadow-sm:0 1px 2px rgba(12,12,13,.05);
  --inter:'Inter',system-ui,sans-serif;
  --open:'Open Sans',system-ui,sans-serif;
  --switch-ms:1600ms;
  --overlay:rgba(34,34,41,.32);
  --coach-text:#3b3a45;
  --coach-border:#f2f2f8;
  --coach-muted:#898999;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg-surface)}
body{font-family:var(--inter);color:var(--text-default);-webkit-font-smoothing:antialiased}
img{display:block}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
p{word-break:break-word}

/* ---------- Stage ---------- */
#app{position:relative;width:1440px;min-height:1095px;display:flex;align-items:stretch;background:var(--bg-surface);margin:0 auto}

/* ---------- Sidebar ---------- */
.sidebar{width:240px;flex-shrink:0;display:flex;flex-direction:column}
.sb-header{height:80px;background:#fff;border-bottom:1px solid var(--stroke);border-right:1px solid var(--stroke);padding:16px 24px 8px;display:flex;align-items:center}
.sb-header .logo-wrap{flex:1;background:#fff;border-radius:8px;padding:12px 16px}
.fid-logo{position:relative;width:45.867px;height:32px;overflow:hidden}
.fid-logo img{position:absolute}
.sb-content{flex:1;background:#fff;border-right:1px solid var(--stroke);padding:24px;display:flex;flex-direction:column;align-items:center;gap:24px;overflow:hidden}

.team-selector{width:192px;display:flex;align-items:center;gap:4px;padding:8px;background:var(--bg-subtle-light);border:1px solid var(--stroke);border-radius:8px;cursor:pointer;transition:border-color .15s,box-shadow .15s}
.team-selector.r-sm{border-radius:4px}
.team-selector:hover{border-color:#c5ccd3}
.team-selector:focus-visible{outline:2px solid var(--brand-500);outline-offset:2px}
.team-selector .ts-content{flex:1;min-width:0;display:flex;align-items:center;gap:8px}
.team-img{width:32px;height:32px;flex-shrink:0;border:1px solid var(--stroke);border-radius:4px;overflow:hidden}
.team-img img{width:100%;height:100%;object-fit:cover}
.ws-text{flex:1;min-width:0;display:flex;flex-direction:column}
.ws-name{font:500 14px/1.6 var(--inter);letter-spacing:-.28px;color:var(--text-default);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ws-role{font:400 12px/1.5 var(--inter);letter-spacing:-.24px;color:var(--text-subtle-light);white-space:nowrap}
.ts-caret{width:16px;height:16px;flex-shrink:0;display:grid;place-items:center}

.nav{width:192px;display:flex;flex-direction:column;gap:4px}
.menu-item{width:192px;display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:8px;background:#fff;cursor:pointer}
.menu-item:hover:not(.active){background:var(--bg-surface)}
.menu-item .mi-content{flex:1;min-width:0;display:flex;align-items:center;gap:8px}
.menu-item img{width:24px;height:24px;flex-shrink:0}
.menu-item p{flex:1;font:400 14px/20px var(--open);letter-spacing:.1px;color:var(--gray-900)}
.menu-item.active{background:var(--blue-50)}
.menu-item.active p{font-weight:600;color:var(--blue-700)}
.submenu{display:flex;flex-direction:column;gap:4px}
.submenu-item{width:192px;height:30px;display:flex;align-items:center;gap:8px;padding:4px 12px 4px 32px;border-radius:8px;background:#fff;cursor:pointer}
.submenu-item:hover{background:var(--bg-surface)}
.submenu-item img{width:8px;height:8px}
.submenu-item p{width:122px;font:400 14px/1.6 var(--open);letter-spacing:-.28px;color:var(--text-subtle)}

/* ---------- Main ---------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
.header-app{height:80px;background:#fff;border-bottom:1px solid var(--stroke);padding:16px 24px;display:flex;align-items:center;justify-content:flex-end;position:relative}
.nav-bar{display:flex;align-items:center;gap:20px}
.btn-icon{position:relative;background:#fff;border-radius:8px;padding:12px;display:flex}
.btn-icon img{width:24px;height:24px}
.badge-dot{position:absolute;left:27px;top:25px;width:8px;height:8px;border-radius:999px;background:var(--error-alert);border:1px solid #fff}
.v-divider{width:1px;height:38.5px;background:var(--stroke)}
.user{display:flex;align-items:center;gap:12px;cursor:pointer;border-radius:8px}
.user:focus-visible{outline:2px solid var(--brand-500);outline-offset:4px}
.user .u-info{display:flex;align-items:center;gap:8px}
.avatar32{width:32px;height:32px;border:1px solid var(--stroke);border-radius:999px;overflow:hidden;flex-shrink:0}
.avatar32 img{width:100%;height:100%;object-fit:cover}
.u-name{font:600 14px/1.5 var(--inter);letter-spacing:-.28px;color:var(--text-default);white-space:nowrap}
.u-mail{font:400 12px/1.5 var(--inter);letter-spacing:-.24px;color:var(--text-subtle-light);white-space:nowrap}
.caret-btn{background:#fff;border:1px solid var(--stroke);border-radius:24px;padding:4px;display:flex}
.caret-btn img{width:14px;height:14px;transition:transform .2s}
.user[aria-expanded="true"] .caret-btn img{transform:rotate(180deg)}

.feed{background:var(--bg-surface);padding:24px;display:flex;flex-direction:column;gap:16px;flex:1}

/* ---------- Comunes ---------- */
.card{background:#fff;border:1px solid var(--stroke);border-radius:12px;padding:16px;overflow:hidden}
.btn-pill{background:#fff;border:1px solid var(--stroke);border-radius:999px;padding:8px 12px;box-shadow:var(--shadow-sm);font:500 12px/1.5 var(--inter);letter-spacing:-.24px;color:var(--text-default);white-space:nowrap;display:inline-flex;align-items:center;justify-content:center}
.btn-pill:hover{background:var(--bg-surface)}

/* ---------- Personal: dashboard ---------- */
.dash-row{display:flex;gap:24px;align-items:flex-start;width:100%}
.dash-left{flex:1;min-width:0;display:flex;flex-direction:column;gap:24px;align-self:stretch}
.dash-top{display:flex;gap:16px;align-items:stretch;width:100%}
.sign-card{width:374px;flex-shrink:0;display:flex;flex-direction:column;gap:12px}
.sign-card .inner{display:flex;flex-direction:column;align-items:center;gap:24px}
.sign-card .head{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%;text-align:center}
.sign-card .head img{width:32px;height:32px}
.t-bold16{font:700 16px/24px var(--open);color:var(--gray-900)}
.t-reg14{font:400 14px/20px var(--open);letter-spacing:.1px;color:var(--gray-700)}
.btn-primary{width:312px;height:43px;border-radius:50px;background:var(--blue-700);color:#fff;font:600 16px/24px var(--open);display:flex;align-items:center;justify-content:center;padding:8px 25px}
.btn-primary:hover{background:#2331b3}
.quick-grid{flex:1;min-width:0;display:flex;flex-direction:column;gap:16px}
.quick-row{flex:1;display:flex;gap:16px;align-items:center}
.quick{flex:1;min-width:0;height:100%;display:flex;align-items:center;padding:16px;border-radius:12px;background:#fff;border:1px solid #eae9ee;box-shadow:var(--shadow-elev1);cursor:pointer}
.quick.empty{background:transparent;border-color:transparent;box-shadow:none;cursor:default}
.quick .q{display:flex;align-items:center;gap:8px}
.quick img{width:24px;height:24px;flex-shrink:0}
.quick p{font:600 12px/16px var(--open);letter-spacing:.1px;color:var(--gray-900)}

.hist{display:flex;flex-direction:column;gap:12px;width:100%}
.card-head{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-start;width:100%}
.card-head .ch-text{flex:1;min-width:250px;display:flex;flex-direction:column;gap:4px;line-height:1.5}
.ch-title{font:600 16px/1.5 var(--inter);letter-spacing:-.32px;color:var(--text-default)}
.ch-sub{font:500 12px/1.5 var(--inter);letter-spacing:-.24px;color:var(--text-subtle-light)}
.tbl{border:1px solid var(--stroke);border-radius:8px;overflow:hidden;width:100%}
.tbl-row{display:grid;border-bottom:1px solid var(--stroke);background:#fff}
.tbl-row.th{background:var(--bg-subtle)}
.tbl-row.th > div{padding:16px;font:400 12px/16px var(--open);letter-spacing:.1px;color:var(--text-subtle);white-space:nowrap}
.tbl-row.td > div{height:53px;padding:16px;display:flex;align-items:center;gap:12px;min-width:0;font:400 14px/20px var(--open);letter-spacing:.1px;color:var(--text-subtle);white-space:nowrap}
.tbl-row.td > div > span.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.hist .tbl-row{grid-template-columns:206px 170px minmax(0,1fr)}
.hist .tbl-row.td > div:nth-child(3){gap:4px}
.chip{display:inline-flex;align-items:center;justify-content:center;padding:4px 8px;border-radius:32px;font:500 10px/1.5 var(--inter);letter-spacing:-.2px;white-space:nowrap;max-width:100%;overflow:hidden}
.chip span{overflow:hidden;text-overflow:ellipsis}
.chip.fill{flex:1;justify-content:flex-start}
.chip.blue{background:var(--blue-100);color:var(--blue-700)}
.chip.purple{background:var(--purple-100);color:var(--purple-700)}

.col3{width:320px;flex-shrink:0;display:flex;flex-direction:column;gap:24px}
.firmas-disp{height:187px;padding:1px;border:1px solid var(--stroke);border-radius:12px;background:#fff;overflow:hidden}
.firmas-disp .bg{padding:20px 16px}
.firmas-disp .stack{height:145px;display:flex;flex-direction:column;justify-content:space-between}
.title-row{display:flex;align-items:center;gap:10px;height:24px}
.title-row img{width:24px;height:24px}
.title-row p{flex:1;font:700 16px/24px var(--open);color:var(--text-default)}
.progress-box{margin-top:12px;background:var(--brand-30);border:1px solid var(--brand-30);border-radius:12px;padding:16px}
.progress-box .pb{height:43px;overflow:hidden;padding:4px 0 16px;display:flex;flex-direction:column;gap:8px}
.bar{height:8px;flex-shrink:0;border-radius:8px;background:#e2e5ef;overflow:hidden;position:relative}
.bar i{position:absolute;left:0;top:0;height:8px;width:135px;border-radius:8px;background:var(--brand-500)}
.bar-label{flex-shrink:0;display:flex;justify-content:center;align-items:center;gap:4px;color:#0c0c0c;white-space:nowrap}
.bar-label b{font:700 16px/24px var(--open)}
.bar-label span{font:400 14px/20px var(--open);letter-spacing:.1px}
.fd-foot{display:flex;justify-content:space-between;font:400 12px/16px var(--open);letter-spacing:.1px;color:var(--text-default)}
.fd-foot a{font-weight:600;text-decoration:underline;color:inherit;cursor:pointer}
.mis-cert{border-color:var(--gray-100);display:flex;flex-direction:column;gap:12px}
.mis-cert .mc-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.mis-cert .mc-head .title-row{flex:1;min-width:0}
.mis-cert .mc-head .title-row p{color:var(--gray-900)}
.cert{border:1px solid var(--gray-100);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.pill{padding:4px 8px;border-radius:16px;font:500 12px/16px var(--inter);letter-spacing:.1px;font-feature-settings:"lnum" 1,"tnum" 1;white-space:nowrap}
.pill.blue{background:var(--blue-200);border:1px solid var(--blue-300);color:var(--blue-600)}
.pill.purple{background:var(--purple-200);border:1px solid var(--purple-400);color:var(--purple-700)}
.cert hr{width:100%;height:1px;border:0;background:var(--blue-200);opacity:.5}
.kv{width:100%;display:flex;flex-direction:column;gap:4px;font:400 12px/16px var(--open);letter-spacing:.1px;color:var(--gray-800)}
.kv > div{display:flex;justify-content:space-between;gap:24px}
.kv > div > span:first-child{white-space:nowrap}
.kv > div > span:last-child{text-align:right}

/* ---------- YPF: firmas ---------- */
.page-head{display:flex;align-items:flex-start;width:100%}
.page-head h1{flex:1;font:600 28px/36px var(--inter);color:var(--text-default)}
.input-box{height:44px;display:flex;align-items:center;gap:8px;padding:12px 16px;border:1px solid var(--stroke);border-radius:8px;background:var(--bg-inputs);white-space:nowrap;cursor:pointer}
.input-box img{width:24px;height:24px}
.input-box p{font:500 14px/1.5 var(--inter);letter-spacing:-.07px;color:var(--text-subtle-light)}
.input-box.white{background:#fff}
.input-box.white p{color:var(--text-default)}
.firmas-card{width:100%;display:flex;flex-direction:column;align-items:center;gap:24px}
.firmas-card .fc-body{width:100%;display:flex;flex-direction:column;gap:24px}
.filters{display:flex;justify-content:space-between;align-items:flex-start}
.search{width:374px;display:flex;align-items:center;gap:8px;padding:12px 16px;border:1px solid var(--stroke);border-radius:8px;background:var(--bg-inputs)}
.search img{width:20px;height:20px}
.search p{font:400 14px/1.6 var(--inter);letter-spacing:-.28px;color:var(--text-placeholder)}
.filters .right{display:flex;gap:8px;align-items:center}
.tbl-scroll{margin-right:-17px;overflow-x:auto;scrollbar-width:none}
.tbl-scroll::-webkit-scrollbar{display:none}
.ypf-tbl{width:1254px;border:1px solid var(--stroke);border-right:0;border-radius:8px 0 0 8px;overflow:hidden}
.tbl > .tbl-row:last-child{border-bottom:0}
.ypf-tbl > .tbl-row:last-child,.hist .tbl > .tbl-row:last-child{border-bottom:1px solid var(--stroke)}
.ypf-tbl .tbl-row{grid-template-columns:104px 245px 153px 160px 139px 131px 144px 178px}
.ypf-tbl .tbl-row.td > div{height:61px}
.ypf-tbl .tbl-row.th > div:nth-child(7){padding-left:33px}
.ypf-tbl .tbl-row.th > div:nth-child(8){padding-left:80px}
.ypf-tbl .tbl-row.td > div:nth-child(7),.ypf-tbl .tbl-row.td > div:nth-child(8){justify-content:center}
.status{padding:4px 16px;border-radius:32px;font:500 14px/1.5 var(--inter);letter-spacing:-.28px;white-space:nowrap}
.status.error{background:var(--error-bg);color:var(--error-text)}
.status.ok{background:var(--success-bg);color:var(--success-text)}
.status.warn{background:var(--warning-bg);color:var(--warning-text)}
.hscroll{height:6px;border-radius:8px;background:#e0e0e0;overflow:hidden;position:relative;width:100%}
.hscroll i{position:absolute;left:0;top:0;height:6px;width:55px;border-radius:8px;background:#c8ccdd}
.pagination{width:574px;display:flex;align-items:center;gap:31px}
.pagination .count{flex:1;white-space:nowrap;text-align:center;font:500 14px/1.6 var(--inter);letter-spacing:-.28px;color:var(--text-subtle)}
.pg{display:flex;gap:12px;align-items:center}
.pg .grp{display:flex;gap:4px;align-items:center}
.pg-btn{height:33px;display:flex;align-items:center;justify-content:center;border:1px solid var(--stroke);border-radius:4px;background:#fff;padding:8px;font:500 14px/1.6 var(--inter);letter-spacing:-.28px;color:var(--text-default)}
.pg-btn.num{padding:8px 12px}
.pg-btn.dots{border-color:transparent;background:transparent;font-weight:600;padding:8px 12px}
.pg-btn img{width:16px;height:16px}

/* ---------- Menús ---------- */
.menu{position:absolute;z-index:30;width:312px;background:#fff;border:1px solid #c5ccd3;box-shadow:var(--shadow-8dp);overflow:hidden;display:flex;flex-direction:column;opacity:0;transform:translateY(-4px) scale(.98);transform-origin:top left;pointer-events:none;transition:opacity .14s ease,transform .14s ease}
.menu.open{opacity:1;transform:none;pointer-events:auto}
#wsMenu{left:222px;top:104px;border-radius:8px}
#userMenu{right:20px;top:84px;border-radius:16px;transform-origin:top right}
.m-div-50{height:1px;width:100%;background:var(--gray-200);opacity:.5;flex-shrink:0}
.m-div{height:1px;width:100%;background:var(--neutral80);flex-shrink:0}
.m-section{display:flex;flex-direction:column;gap:8px;padding:16px}
.m-title{font:500 14px/normal var(--inter);color:var(--text-default);white-space:nowrap}
.m-over{font:600 11px/normal var(--inter);color:var(--text-subtle-light);text-transform:uppercase;white-space:nowrap}
.acc-list{display:flex;flex-direction:column;gap:16px;padding:8px 0;width:100%}
#userMenu .acc-list{padding:0}
.acc{width:100%;display:flex;align-items:center;gap:8px;padding:8px 16px 8px 8px;border-radius:8px;cursor:pointer;transition:background .12s}
.acc:hover:not(.active){background:var(--bg-surface)}
.acc:focus-visible{outline:2px solid var(--brand-500);outline-offset:-2px}
.acc.active{background:var(--brand-50)}
.acc .radio{width:24px;height:24px;flex-shrink:0;display:grid;place-items:center}
.acc .radio img{width:24px;height:24px}
.acc.active .radio img{width:18px;height:18px}
.um-top{background:var(--brand-20);padding:16px;display:flex;flex-direction:column;align-items:center;gap:8px}
.avatar56{width:56px;height:56px;border-radius:999px;background:var(--brand-100);border:1.5px solid var(--stroke);display:grid;place-items:center;font:600 24px/1.33 var(--inter);letter-spacing:-.48px;color:var(--brand-500)}
.um-name{font:600 16px/1.5 var(--inter);letter-spacing:-.32px;color:var(--text-default)}
.um-section{display:flex;flex-direction:column;gap:12px;padding:16px}
.um-foot{background:#fff;padding:16px}
.btn-outline{width:100%;height:40px;border:1px solid var(--brand-500);border-radius:20px;display:flex;align-items:center;justify-content:center;font:500 14px/18px var(--inter);color:var(--brand-500);font-feature-settings:"lnum" 1,"tnum" 1}
.btn-outline:hover{background:var(--brand-20)}

/* ---------- Transición de cambio de espacio ---------- */
.swap{transition:opacity .22s ease}
.swap.fade-out{opacity:0}
.swap.fade-in{animation:fadeIn .32s ease both}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

.sk{position:relative;overflow:hidden;background:var(--bg-subtle);border-radius:6px}
.sk::after{content:"";position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,rgba(255,255,255,.75),transparent);animation:shimmer 1.2s infinite}
@keyframes shimmer{to{transform:translateX(100%)}}
.sk-item{width:192px;display:flex;align-items:center;gap:8px;padding:8px 12px;height:40px}
.sk-line{height:10px;border-radius:999px}
.sk-row{display:flex;align-items:center;gap:16px;padding:16px;border-bottom:1px solid var(--stroke);background:#fff}
.sk-row:last-child{border-bottom:0}

.ts-spinner,.spinner{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.team-selector.loading{cursor:progress;border-color:var(--brand-100);box-shadow:0 0 0 3px var(--brand-50)}

.top-progress{position:absolute;left:0;bottom:-1px;height:2px;width:0;background:var(--brand-500);opacity:0;z-index:5}
.top-progress.run{opacity:1;animation:progress var(--switch-ms) cubic-bezier(.2,.7,.3,1) forwards}
.top-progress.done{opacity:0;width:100%;transition:opacity .3s .1s}
@keyframes progress{0%{width:0}100%{width:88%}}

.loading-toast{position:absolute;z-index:20;left:50%;top:320px;transform:translate(-50%,8px);opacity:0;pointer-events:none;display:flex;align-items:center;gap:12px;padding:16px 20px;background:#fff;border:1px solid var(--stroke);border-radius:12px;box-shadow:var(--shadow-8dp);transition:opacity .2s ease,transform .2s ease}
.loading-toast.show{opacity:1;transform:translate(-50%,0)}
.loading-toast .lt-team{width:32px;height:32px;border:1px solid var(--stroke);border-radius:4px;overflow:hidden;flex-shrink:0}
.loading-toast .lt-team img{width:100%;height:100%;object-fit:cover}
.lt-title{font:600 14px/1.5 var(--inter);letter-spacing:-.28px;color:var(--text-default);white-space:nowrap}
.lt-sub{font:400 12px/1.5 var(--inter);letter-spacing:-.24px;color:var(--text-subtle-light);white-space:nowrap}

.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- Coachmark (patrón de firma: Dashboard 2.0) ---------- */
.coach-overlay{position:absolute;inset:0;z-index:60;overflow:hidden;opacity:0;pointer-events:none;transition:opacity .2s ease}
.coach-overlay.show{opacity:1;pointer-events:auto}
.coach-spot{position:absolute;border-radius:12px;box-shadow:0 0 0 9999px var(--overlay);transition:all .3s cubic-bezier(.2,.7,.3,1)}
.coach{position:absolute;width:312px;display:flex;transition:left .3s cubic-bezier(.2,.7,.3,1),top .3s cubic-bezier(.2,.7,.3,1)}
.coach-body{flex:1;min-width:0;background:#fff;border:1px solid var(--coach-border);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:8px;position:relative;z-index:1}
.coach-head{display:flex;gap:16px;align-items:flex-start}
.coach-title{flex:1;font:700 14px/24px var(--inter);color:var(--coach-text);font-feature-settings:"lnum" 1,"tnum" 1}
.coach-close{padding:2px;border-radius:8px;display:flex}
.coach-close:hover{background:var(--bg-subtle)}
.coach-close img{width:16px;height:16px}
.coach-desc{font:400 14px/20px var(--inter);letter-spacing:.1px;color:var(--coach-text);font-feature-settings:"lnum" 1,"tnum" 1}
.coach-foot{display:flex;align-items:center;justify-content:flex-end;gap:16px}
.coach-step{flex:1;font:400 12px/16px var(--inter);color:var(--coach-muted)}
.coach-cta{background:var(--brand-500);color:#fff;border-radius:999px;padding:8px 12px;font:500 14px/20px var(--inter);letter-spacing:.1px;font-feature-settings:"lnum" 1,"tnum" 1}
.coach-cta:hover{background:#2331b3}
.coach-cta:focus-visible,.coach-close:focus-visible{outline:2px solid var(--brand-500);outline-offset:2px}
.coach-beak{position:absolute;z-index:2;width:12px;height:34px}
.coach[data-side="right"] .coach-beak{left:-11px;top:50%;margin-top:-17px}
.coach[data-side="bottom"] .coach-beak{top:-22px;transform:rotate(90deg)}

@media (prefers-reduced-motion:reduce){
  .coach,.coach-spot{transition:none}
  .sk::after,.ts-spinner,.spinner{animation-duration:2.4s}
  .swap.fade-in{animation:none}
  .menu{transition:none}
}
</style>

  }
  return r;
}

let openMenu = null;
function toggleMenu(id, force, viaKeyboard){
  const el = document.getElementById(id);
  const willOpen = force ?? !el.classList.contains('open');
  closeMenus();
  if(!willOpen || switching || coachIdx >= 0) return;
  el.classList.add('open');
  openMenu = id;
  (id==='wsMenu' ? $('#teamSelector') : $('#userBtn'))?.setAttribute('aria-expanded','true');
  if(viaKeyboard) el.querySelector('.acc.active')?.focus({preventScroll:true});
}
function closeMenus(){
  document.querySelectorAll('.menu.open').forEach(m=>m.classList.remove('open'));
  $('#teamSelector').setAttribute('aria-expanded','false');
  $('#userBtn')?.setAttribute('aria-expanded','false');
  openMenu = null;
}

/* ---------- Render completo ---------- */
function render(){
  const ws = WORKSPACES[current];
  const ts = $('#teamSelector');
  ts.classList.toggle('r-sm', ws.selectorRadius==='sm');
  ts.classList.remove('loading');
  ts.innerHTML = teamSelectorHTML(ws,false);
  ts.setAttribute('aria-label', `Espacio de trabajo: ${ws.name}, ${ws.role}`);
  $('#nav').innerHTML = navHTML(ws);
  $('#navBar').innerHTML = navBarHTML(ws);
  $('#feed').innerHTML = current==='personal' ? personalHTML() : ypfHTML();
  renderMenus();
  bindDynamic();
}
function bindDynamic(){
  const u = $('#userBtn');
  if(u){
    u.onclick = e => { e.stopPropagation(); toggleMenu('userMenu'); };
    u.onkeydown = e => { if(e.key==='Enter'||e.key===' '){ e.preventDefault(); toggleMenu('userMenu', undefined, true); } };
  }
  const sc = $('#tblScroll'), th = $('#hThumb');
  if(sc && th){
    const track = th.parentElement;
    const sync = () => {
      const max = sc.scrollWidth - sc.clientWidth;
      const tw = track.clientWidth;
      const w = 55;
      th.style.transform = `translateX(${max>0 ? (sc.scrollLeft/max)*(tw-w) : 0}px)`;
    };
    sc.addEventListener('scroll', sync, {passive:true});
    sync();
  }
}

/* ---------- Cambio de espacio de trabajo ---------- */
function spinnerSVG(size){
  return `<svg class="spinner" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" aria-hidden="true">
    <circle cx="12" cy="12" r="9" stroke="var(--brand-50)" stroke-width="3"/>
    <path d="M21 12a9 9 0 0 0-9-9" stroke="var(--brand-500)" stroke-width="3" stroke-linecap="round"/></svg>`;
}
const wait = ms => new Promise(r=>setTimeout(r,ms));

async function switchWorkspace(target){
  if(switching || coachIdx >= 0 || target===current) { closeMenus(); return; }
  switching = true;
  const ws = WORKSPACES[target];

  // 1. Marca la selección en el menú y lo cierra
  document.querySelectorAll('.menu .acc').forEach(a=>{
    const on = a.dataset.ws===target;
    a.classList.toggle('active',on);
    a.setAttribute('aria-checked',on);
    a.querySelector('.radio img').src = asset(on?'radio-on.svg':'radio-off.svg');
  });
  await wait(160);
  closeMenus();

  // 2. Selector muestra el destino + spinner; barra de progreso
  const ts = $('#teamSelector');
  ts.classList.toggle('r-sm', ws.selectorRadius==='sm');
  ts.classList.add('loading');
  ts.innerHTML = teamSelectorHTML(ws,true);
  const bar = $('#topProgress');
  bar.classList.remove('done'); void bar.offsetWidth; bar.classList.add('run');

  // 3. Fade-out del contenido actual → skeletons con la geometría del destino
  const parts = ['#nav','#navBar','#feed'].map(s=>$(s));
  parts.forEach(p=>{ p.classList.remove('fade-in'); p.classList.add('fade-out'); });
  await wait(200);
  $('#nav').innerHTML = navSkeletonHTML(ws);
  $('#navBar').innerHTML = navBarSkeletonHTML(ws);
  $('#feed').innerHTML = target==='personal' ? personalSkeletonHTML() : ypfSkeletonHTML();
  parts.forEach(p=>{ p.classList.remove('fade-out'); p.classList.add('fade-in'); });

  const toast = $('#loadingToast');
  toast.innerHTML = `${spinnerSVG(24)}
    <div class="lt-team"><img src="${ws.img}" alt=""></div>
    <div><p class="lt-title">Cambiando a ${esc(ws.name)}</p><p class="lt-sub">Cargando espacio de trabajo…</p></div>`;
  toast.classList.add('show');

  const ms = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--switch-ms'));
  await wait(ms);

  // 4. Espacio cargado
  toast.classList.remove('show');
  bar.classList.remove('run'); bar.classList.add('done');
  parts.forEach(p=>{ p.classList.remove('fade-in'); p.classList.add('fade-out'); });
  await wait(160);
  current = target;
  render();
  parts.forEach(p=>{ p.classList.remove('fade-out'); void p.offsetWidth; p.classList.add('fade-in'); });
  switching = false;
}

/* ---------- Eventos ---------- */
$('#teamSelector').addEventListener('click', e=>{ e.stopPropagation(); toggleMenu('wsMenu', undefined, e.detail===0); });
document.addEventListener('click', e=>{
  const acc = e.target.closest('.acc');
  if(acc){ e.stopPropagation(); switchWorkspace(acc.dataset.ws); return; }
  if(!e.target.closest('.menu')) closeMenus();
});
document.addEventListener('keydown', e=>{
  if(e.key==='Escape' && openMenu){
    const back = openMenu==='wsMenu' ? $('#teamSelector') : $('#userBtn');
    closeMenus(); back?.focus();
  }
  const acc = e.target.closest?.('.acc');
  if(acc && (e.key==='Enter'||e.key===' ')){ e.preventDefault(); switchWorkspace(acc.dataset.ws); }
  if(acc && (e.key==='ArrowDown'||e.key==='ArrowUp')){
    e.preventDefault();
    const list=[...acc.parentElement.querySelectorAll('.acc')];
    const i=list.indexOf(acc)+(e.key==='ArrowDown'?1:-1);
    list[(i+list.length)%list.length].focus();
  }
});

/* ---------- Escala para pantallas < 1440px ---------- */
function fit(){
  const app = $('#app');
  const s = Math.min(1, window.innerWidth/1440);
  app.style.zoom = s;
  app.style.minHeight = Math.max(1095, window.innerHeight/s)+'px';
}
window.addEventListener('resize', fit);
fit();

/* ---------- Coachmark: dónde se cambia de espacio de trabajo ---------- */
const COACH_STEPS = [
  {target:'#teamSelector', side:'right', title:'Cambiá de espacio de trabajo', desc:'Pasá de tu cuenta personal al espacio de tu organización sin cerrar sesión.', cta:'Siguiente'},
  {target:'#userBtn', side:'bottom', title:'También desde tu perfil', desc:'Abrí tu menú de usuario para elegir otro espacio de trabajo.', cta:'Entendido'},
];
$('#coachBeak').src = asset('coach-beak.svg');
$('#coachCloseImg').src = asset('coach-close.svg');

function placeCoach(){
  if(coachIdx < 0) return;
  const step = COACH_STEPS[coachIdx];
  const app = $('#app'), z = parseFloat(app.style.zoom) || 1;
  const ar = app.getBoundingClientRect(), tr = $(step.target).getBoundingClientRect();
  // coordenadas dentro de #app (antes del zoom)
  const t = {x:(tr.left-ar.left)/z, y:(tr.top-ar.top)/z, w:tr.width/z, h:tr.height/z};
  const pad = 6, spot = $('#coachSpot'), coach = $('#coach');
  Object.assign(spot.style, {left:t.x-pad+'px', top:t.y-pad+'px', width:t.w+pad*2+'px', height:t.h+pad*2+'px'});
  coach.dataset.side = step.side;
  if(step.side === 'right'){
    coach.style.left = t.x + t.w + pad + 14 + 'px';
    coach.style.top = t.y + t.h/2 - coach.offsetHeight/2 + 'px';
  } else {
    const left = Math.min(t.x + t.w - 312 + pad, app.offsetWidth - 312 - 16);
    coach.style.left = left + 'px';
    coach.style.top = t.y + t.h + pad + 14 + 'px';
    $('#coachBeak').style.left = (t.x + t.w/2 - left - 6) + 'px';
  }
}
function showCoach(i){
  if(i >= COACH_STEPS.length) return closeCoach();
  closeMenus();
  coachIdx = i;
  const step = COACH_STEPS[i];
  $('#coachTitle').textContent = step.title;
  $('#coachDesc').textContent = step.desc;
  $('#coachCta').textContent = step.cta;
  $('#coachStep').textContent = `${i+1} de ${COACH_STEPS.length}`;
  $('#coachBeak').style.left = '';
  const ov = $('#coachOverlay');
  ov.classList.add('show'); ov.setAttribute('aria-hidden','false');
  placeCoach();
  $('#coachCta').focus({preventScroll:true, focusVisible:false});
}
function closeCoach(){
  coachIdx = -1;
  const ov = $('#coachOverlay');
  ov.classList.remove('show'); ov.setAttribute('aria-hidden','true');
}
$('#coachCta').addEventListener('click', e => { e.stopPropagation(); showCoach(coachIdx + 1); });
$('#coachClose').addEventListener('click', e => { e.stopPropagation(); closeCoach(); });
$('#coachOverlay').addEventListener('click', e => e.stopPropagation());
document.addEventListener('keydown', e => { if(e.key === 'Escape' && coachIdx >= 0){ e.stopImmediatePropagation(); closeCoach(); } }, true);
window.addEventListener('resize', placeCoach);

/* ---------- Deep-links para demo: #ypf, #menu-espacios, #menu-usuario, #cambiar, #coachmark, #coachmark-2 (combinables con +) ---------- */
const flags = location.hash.slice(1).split('+');
if(flags.includes('ypf')) current = 'ypf';
render();
if(flags.includes('menu-espacios')) toggleMenu('wsMenu', true);
if(flags.includes('menu-usuario')) toggleMenu('userMenu', true);
if(flags.includes('cambiar')) setTimeout(()=>switchWorkspace(current==='ypf'?'personal':'ypf'), 300);
const demoFlags = ['menu-espacios','menu-usuario','cambiar'];
if(flags.includes('coachmark-2')) showCoach(1);
else if(!flags.some(f=>demoFlags.includes(f))) document.fonts.ready.then(()=>showCoach(0)); // siempre al entrar al link
</script>
